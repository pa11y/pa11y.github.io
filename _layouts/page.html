<!DOCTYPE html>
<html lang="en-GB">
<head>

	<meta charset="utf-8"/>
	<title>{{page.title}}</title>
	<meta name="description" content="{{page.description}}"/>
	{% if page.sitemap == false %}<meta name="robots" content="noindex"/>{% endif %}

	<link rel="alternate" type="application/atom+xml" href="/news/feed.xml" title="Pa11y News Feed"/>
	<link rel="sitemap" type="application/xml" href="/sitemap.xml" title="Sitemap"/>
	<link rel="canonical" href="{{site.github.url}}{{ page.url | replace: 'index.html', '' }}"/>

	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<link rel="stylesheet" href="/asset/style/site.css"/>

	<link rel="icon" href="/favicon.png" type="image/png"/>
	<link rel="shortcut icon" href="/favicon.ico"/>
	<meta name="application-name" content="{{page.title}}"/>

</head>
<body class="no-js">

	{% include header.html %}

	<main role="main">
		<div class="main-content">
			{{content}}
		</div>
	</main>

	{% include footer.html %}

	<script type="text/javascript" src="/asset/script/site.js"></script>
</body>
</html>
